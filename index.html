<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#eff8ff;background:#030712}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
#game{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hud{position:fixed;z-index:4;inset:0;pointer-events:none;padding:clamp(18px,3vw,38px);padding-top:max(22px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}
.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.brand{display:flex;gap:12px;align-items:center;text-shadow:0 2px 18px #000}
.brand-mark{width:36px;height:36px;border:1px solid #86ddff66;border-radius:11px;display:grid;place-items:center;background:#0b192166;color:#8ae9ff;font-size:23px}
.brand h1{margin:0;font-size:19px;font-weight:650;letter-spacing:3px}

.score-box{text-align:right;font-variant-numeric:tabular-nums}

#score{font-size:28px;font-weight:500;line-height:1;letter-spacing:2px}
button{font:inherit;color:#c7ddeb;border:1px solid #8baab833;background:#0d1a26bb;backdrop-filter:blur(12px);cursor:pointer;border-radius:10px;transition:background .2s,border-color .2s}

@media(max-width:600px){.health-panel{top:83px;width:129px;font-size:9px}.health-panel small{font-size:8px}#boss-status{top:143px;width:calc(100vw - 36px)}.boss-caption{gap:8px}.boss-caption strong{font-size:9px}#overload{min-width:170px;gap:8px;padding:10px;margin-top:8px}#overload b{font-size:25px}#overload-state{font-size:11px}#overload small{font-size:8px;letter-spacing:0}.hint{max-width:145px}.weapon strong{font-size:9px}.brand h1{letter-spacing:1px}}
@media(max-height:500px) and (min-width:601px){.health-panel{top:80px}#boss-status{top:83px}.hud{padding-bottom:12px}.hint{font-size:9px}#overload{padding:7px 11px;margin-top:5px}}

<body>
<canvas id="game" aria-label="飞机大战：移动鼠标或触屏拖动控制飞机，自动发射子弹"></canvas>
<div class="hud">
  <div class="top">
    <div class="brand"><div class="brand-mark" aria-hidden="true">✧</div><div><h1>星际突围</h1><div class="eyebrow">DEEP SPACE / 01</div></div></div>
    <div class="status"><div class="score-box"><span>击落</span><div id="score">000</div></div><button id="pause" type="button" disabled aria-label="暂停游戏" aria-pressed="false">Ⅱ 暂停</button></div>
  </div>
  <div class="bottom">
    <div class="hint"><i class="hint-dot"></i><span>鼠标自由移动 · 触屏拖动<br>碰撞即毁 · 空格暂停</span></div>
    <div class="weapon"><strong id="weapon-status">自动连射 · 12.5 发/秒</strong><br><button id="overload" type="button" aria-label="开启10秒三束超载，60秒冷却" aria-pressed="false"><b>ϟ</b><span><span id="overload-state">超载就绪</span><small>右键 / E · 持续 10s · CD 60s</small></span></button></div>
  </div>
</div>
<div class="health-panel"><div class="health-caption"><span>机体装甲</span><strong id="health-value">20 / 20</strong></div><div id="health-meter" class="health-track" role="progressbar" aria-label="玩家血量" aria-valuemin="0" aria-valuemax="20" aria-valuenow="20"><i id="health-fill"></i></div><small>敌弹 −1 · 机体碰撞即毁</small></div>
<div id="boss-status" hidden><div class="boss-caption"><strong>无畏舰 / BOSS</strong><span id="boss-mode">敌舰接近中</span><span id="boss-health">100 / 100</span></div><div class="boss-track"><i id="boss-fill"></i></div></div>
<div id="loading" class="modal-wrap"><div class="panel"><div class="eyebrow">DEEP SPACE</div><h2>正在进入深空</h2><p id="load-message">准备飞船与星图…</p></div></div>
<div id="game-over" class="modal-wrap" hidden><div class="panel"><div class="eyebrow">MISSION COMPLETE</div><h2>本次航行结束</h2><p id="death-reason">装甲耗尽</p><div class="result" id="final-score">0</div><div class="best" id="best-score">最高击落 0</div><button id="restart" class="primary" type="button">再次出发 →</button><p class="shortcut">按 R / Enter 或点击背景重新开始</p></div></div>
<div id="pause-overlay" class="modal-wrap" hidden><div class="panel"><div class="eyebrow">FLIGHT ON HOLD</div><h2>航行已暂停</h2><p>星海会等你。准备好后继续航行。</p><button id="resume" class="primary" type="button">继续航行 →</button><p class="shortcut">按空格继续</p></div></div>
<script>
'use strict';
/** Procedural, offline space art. All expensive textures are cached on resize. */
class SpaceBackground {
    constructor(width, height) {
        this.assets = {
            uranus: this.makePlanet('uranus'),
            neptune: this.makePlanet('neptune'),
            ember: this.makePlanet('ember'),
            blackHole: this.makeBlackHole()
        };
        this.resize(width, height);
    }

    random(seed) {
        return () => {
            seed |= 0;
            seed = seed + 0x6D2B79F5 | 0;
            let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    canvas(width, height) {
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(width));
        c.height = Math.max(1, Math.round(height));
        return c;
    }

    glow(ctx, x, y, radius, color, alpha = 1) {
        const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
        gradient.addColorStop(0, `rgba(${color},${alpha})`);
        gradient.addColorStop(0.32, `rgba(${color},${alpha * 0.44})`);
        gradient.addColorStop(1, `rgba(${color},0)`);
        ctx.fillStyle = gradient;
        ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }

    resize(width, height) {
        this.width = Math.max(1, width);
        this.height = Math.max(1, height);
        const scale = Math.min(1, 1600 / Math.max(this.width, this.height));
        this.field = this.canvas(this.width * scale * 1.12, this.height * scale * 1.12);
        this.makeField();
        const random = this.random(71324);
        this.nearStars = Array.from({ length: 64 }, () => ({
            x: random(), y: random(), size: 0.4 + random() * 1.05,
            speed: 3 + random() * 13, phase: random() * Math.PI * 2,
            blue: random() > 0.45
        }));
    }

    makeField() {
        const c = this.field;
        const ctx = c.getContext('2d');
        const w = c.width, h = c.height;
        const random = this.random(12093);
        const base = ctx.createLinearGradient(0, 0, w, h);
        base.addColorStop(0, '#071126');
        base.addColorStop(0.44, '#030a19');
        base.addColorStop(1, '#081022');
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, w, h);
        // Asymmetric cloud banks with a dark navigable corridor through their centre.
        const banks = [
            { x: 0.02, y: 0.34, r: 0.40, color: '44,78,157', a: 0.31 },
            { x: 0.23, y: 0.69, r: 0.39, color: '73,49,149', a: 0.26 },
            { x: 0.83, y: 0.23, r: 0.32, color: '105,46,123', a: 0.24 },
            { x: 0.95, y: 0.73, r: 0.30, color: '19,98,127', a: 0.24 },
            { x: 0.62, y: 1.04, r: 0.39, color: '48,54,117', a: 0.30 }
        ];
        ctx.globalCompositeOperation = 'screen';
        const shortSide = Math.min(w, h);
        for (const bank of banks) {
            this.glow(ctx, bank.x * w, bank.y * h, bank.r * Math.max(w, h), bank.color, bank.a);
            for (let i = 0; i < 52; i++) {
                const angle = random() * Math.PI * 2;
                const spread = Math.sqrt(random()) * shortSide * bank.r;
                const x = bank.x * w + Math.cos(angle) * spread;
                const y = bank.y * h + Math.sin(angle) * spread * 0.7;
                const radius = shortSide * (0.025 + random() * 0.11);
                this.glow(ctx, x, y, radius, bank.color, 0.014 + random() * 0.04);
            }
        }
        this.addCloudTexture(ctx, w, h, random);
        // Thin luminous filaments make the nebula read as gas rather than a flat gradient.
        for (let i = 0; i < 70; i++) {
            const t = i / 70;
            const x = w * (0.04 + t * 0.25) + (random() - 0.5) * shortSide * 0.12;
            const y = h * (0.28 + t * 0.48) + Math.sin(t * 11) * shortSide * 0.055;
            this.glow(ctx, x, y, shortSide * (0.018 + random() * 0.038), i % 3 ? '74,105,193' : '143,96,188', 0.048);
        }
        ctx.globalCompositeOperation = 'source-over';
        // Dust lanes break up the brightest clouds. They are generated only once.
        for (let i = 0; i < 44; i++) {
            const x = random() * w, y = random() * h;
            this.glow(ctx, x, y, shortSide * (0.025 + random() * 0.075), '1,4,13', 0.08 + random() * 0.1);
        }
        const count = Math.round(Math.min(1600, Math.max(450, w * h / 730)));
        for (let i = 0; i < count; i++) {
            const x = random() * w, y = random() * h;
            const prominent = random() > 0.986;
            const radius = prominent ? 1.2 + random() * 0.65 : 0.25 + random() * 0.75;
            const palette = random();
            const color = palette > 0.87 ? '255,205,164' : palette > 0.5 ? '161,203,255' : '215,227,255';
            const alpha = prominent ? 0.9 : 0.2 + random() * 0.55;
            if (prominent) {
                this.glow(ctx, x, y, radius * 7, color, 0.20);
                ctx.strokeStyle = `rgba(${color},0.25)`;
                ctx.lineWidth = 0.55;
                ctx.beginPath();
                ctx.moveTo(x - radius * 4, y); ctx.lineTo(x + radius * 4, y);
                ctx.moveTo(x, y - radius * 4); ctx.lineTo(x, y + radius * 4);
                ctx.stroke();
            }
            ctx.fillStyle = `rgba(${color},${alpha})`;
            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
        }
        const vignette = ctx.createRadialGradient(w * 0.5, h * 0.50, shortSide * 0.12, w * 0.5, h * 0.5, Math.max(w, h) * 0.72);
        vignette.addColorStop(0, 'rgba(0,2,10,0.10)');
        vignette.addColorStop(1, 'rgba(0,2,10,0.48)');
        ctx.fillStyle = vignette; ctx.fillRect(0, 0, w, h);
    }

    addCloudTexture(ctx, width, height, random) {
        // Fractal value noise is baked at modest resolution; there is no pixel work in draw().
        const scale = 440 / Math.max(width, height);
        const mist = this.canvas(width * scale, height * scale);
        const mc = mist.getContext('2d');
        const pixels = mc.createImageData(mist.width, mist.height);
        const grid = Float32Array.from({ length: 16384 }, () => random());
        const noise = (x, y) => {
            let ix = Math.floor(x), iy = Math.floor(y);
            let fx = x - ix, fy = y - iy;
            fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
            const a = grid[((iy & 127) << 7) | (ix & 127)];
            const b = grid[((iy & 127) << 7) | ((ix + 1) & 127)];
            const c = grid[(((iy + 1) & 127) << 7) | (ix & 127)];
            const d = grid[(((iy + 1) & 127) << 7) | ((ix + 1) & 127)];
            return (a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy;
        };
        for (let y = 0; y < mist.height; y++) {
            const ny = y / mist.height;
            for (let x = 0; x < mist.width; x++) {
                const nx = x / mist.width;
                const bend = noise(nx * 3 + 41, ny * 4 + 8);
                let value = 0, amplitude = 0.53, frequency = 3.2;
                for (let octave = 0; octave < 5; octave++) {
                    value += noise(nx * frequency + bend, ny * frequency * 1.4 + 13) * amplitude;
                    frequency *= 2.1; amplitude *= 0.5;
                }
                const left = Math.exp(-Math.pow((nx - 0.15 - Math.sin(ny * 7) * 0.1) / 0.22, 2));
                const right = Math.exp(-Math.pow((nx - 0.94 + ny * 0.12) / 0.2, 2));
                const filament = Math.pow(Math.max(0, 1 - Math.abs(value - 0.51) * 5), 4);
                const alpha = (Math.max(0, value - 0.36) * 0.4 + filament * 0.026) * Math.max(left, right * 0.65);
                const i = (y * mist.width + x) * 4;
                pixels.data[i] = nx < 0.55 ? 85 : 108;
                pixels.data[i + 1] = nx < 0.55 ? 98 : 61;
                pixels.data[i + 2] = 173;
                pixels.data[i + 3] = Math.min(55, alpha * 255);
            }
        }
        mc.putImageData(pixels, 0, 0);
        ctx.drawImage(mist, 0, 0, width, height);
    }

    makePlanet(kind) {
        const c = this.canvas(640, 640), ctx = c.getContext('2d');
        const x = 320, y = 320, r = kind === 'uranus' ? 126 : 185;
        const random = this.random(kind === 'uranus' ? 518 : kind === 'neptune' ? 8743 : 152);
        const ring = (front) => {
            ctx.save(); ctx.translate(x, y); ctx.rotate(-0.58);
            // Several thin, translucent rings preserve the recognisable Uranus silhouette.
            for (let i = 0; i < 15; i++) {
                const radius = 211 + i * 2.7;
                ctx.strokeStyle = `rgba(${i < 4 ? '121,207,220' : '173,226,229'},${0.06 + (i % 4 === 0 ? 0.14 : 0.025)})`;
                ctx.lineWidth = i % 4 === 0 ? 1.2 : 0.8;
                ctx.beginPath();
                ctx.ellipse(0, 0, radius, radius * 0.28, 0, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();
        };
        const aura = kind === 'uranus' ? '80,204,222' : kind === 'neptune' ? '45,112,255' : '230,135,68';
        this.glow(ctx, x, y, r * 1.19, aura, 0.25);
        if (kind === 'uranus') ring(false);
        ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
        const sphere = ctx.createRadialGradient(x - r * 0.48, y - r * 0.48, r * 0.03, x - r * 0.13, y - r * 0.08, r * 1.28);
        if (kind === 'uranus') {
            sphere.addColorStop(0, '#b8eced'); sphere.addColorStop(0.36, '#72c5cd');
            sphere.addColorStop(0.72, '#347e95'); sphere.addColorStop(1, '#071428');
        } else if (kind === 'neptune') {
            sphere.addColorStop(0, '#6198f1'); sphere.addColorStop(0.32, '#356fcd');
            sphere.addColorStop(0.68, '#194187'); sphere.addColorStop(1, '#050b24');
        } else {
            sphere.addColorStop(0, '#d4a079'); sphere.addColorStop(0.35, '#a15f48');
            sphere.addColorStop(0.7, '#582b30'); sphere.addColorStop(1, '#100d21');
        }
        ctx.fillStyle = sphere; ctx.fillRect(0, 0, 640, 640);
        ctx.translate(x, y); ctx.rotate(kind === 'uranus' ? -0.13 : -0.23);
        for (let i = 0; i < 120; i++) {
            const yy = -r + (i / 120) * r * 2;
            const wave = Math.sin(i * 0.5) * 2 + Math.sin(i * 0.137) * 5;
            ctx.strokeStyle = kind === 'neptune'
                ? `rgba(${i % 5 === 0 ? '125,180,255' : '4,28,99'},${0.04 + random() * 0.10})`
                : kind === 'uranus' ? `rgba(180,244,241,${0.015 + random() * 0.055})`
                : `rgba(${i % 3 === 0 ? '246,183,130' : '63,23,24'},${0.05 + random() * 0.08})`;
            ctx.lineWidth = 1 + random() * 5;
            ctx.beginPath(); ctx.moveTo(-r - 10, yy);
            ctx.bezierCurveTo(-r * 0.3, yy - wave, r * 0.4, yy + wave, r + 10, yy + 1);
            ctx.stroke();
        }
        if (kind === 'neptune') {

    makeBlackHole() {

            ctx.save();

                const radius = 102 + i * 3.4;

                ctx.strokeStyle = `rgba(${i < 13 ? '255,222,179' : i < 26 ? '255,154,92' : '173,89,105'},${(1 - t) * (front ? 0.43 : 0.21)})`;

        place(this.assets.uranus, w * (portrait ? 0.15 : 0.15), h * (portrait ? 0.25 : 0.29),
            shortSide * (portrait ? 0.66 : 0.57), 0.80, 0.8);
        place(this.assets.neptune, w * (portrait ? 0.89 : 0.86), h * (portrait ? 0.56 : 0.60),
            shortSide * (portrait ? 0.49 : 0.47), 0.72, 2.1);
        place(this.assets.blackHole, w * (portrait ? 0.76 : 0.74), h * (portrait ? 0.19 : 0.20),
            shortSide * (portrait ? 0.59 : 0.62), 0.85 + Math.sin(t * 0.3) * 0.025, 3.6);

            ctx.fillStyle = star.blue ? `rgba(156,211,255,${twinkle})` : `rgba(241,232,214,${twinkle})`;
            ctx.fillRect(x, y, star.size, star.size + star.speed * 0.045);
        }
        ctx.restore();
    }
}

function bossTargetY(enemyHeight){
  // Reserve the HUD row on phones while keeping the flagship in the upper field.
  const hudFloor=width<=600?(height<=500?120:184):(height<=500?124:132);
  return Math.min(Math.max(height*.18,hudFloor),Math.max(0,height-enemyHeight-Math.min(90,height*.18)));
}
function enemySize(type){
  const sprite=tierSprites[type].sprite;
  const w=type==='boss'?Math.min(350,width*.72,Math.max(56,height*.28)*sprite.width/sprite.height):type==='advanced'?Math.min(112,width*.25):Math.min(68,width*.17);
  return {w,h:w*sprite.height/sprite.width};
}
function resize(){
  const oldWidth=width,oldHeight=height;
  width=Math.max(1,innerWidth);height=Math.max(1,innerHeight);
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  const cx=hero.x+hero.w/2,cy=hero.y+hero.h/2;
  hero.w=Math.min(width,96,Math.max(58,width*.16));
  hero.h=Math.min(height,hero.w*(sprites?sprites.hero.height/sprites.hero.width:1.18));
  hero.x=clamp(cx/oldWidth*width-hero.w/2,0,Math.max(0,width-hero.w));
  hero.y=clamp(cy/oldHeight*height-hero.h/2,0,Math.max(0,height-hero.h));
  if(tierSprites)for(const enemy of enemies){
    const center=(enemy.x+enemy.w/2)/oldWidth,progress=enemy.y/oldHeight;
    const size=enemySize(enemy.type);Object.assign(enemy,size);
    enemy.targetY=bossTargetY(enemy.h);
    enemy.x=enemy.type==='boss'?(width-enemy.w)/2:clamp(center*width-enemy.w/2,0,width-enemy.w);
    enemy.y=enemy.type==='boss'&&enemy.settled?enemy.targetY:Math.min(progress*height,enemy.type==='boss'?enemy.targetY:height);
  }
  if(background)background.resize(width,height);
}
function placeHero(clientX,clientY){
  if(state!=='playing')return;
  const r=canvas.getBoundingClientRect();
  hero.x=clamp((clientX-r.left)*width/r.width-hero.w/2,0,width-hero.w);
  hero.y=clamp((clientY-r.top)*height/r.height-hero.h/2,0,height-hero.h);
}
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'||e.pointerId===activeTouch)placeHero(e.clientX,e.clientY);
});
canvas.addEventListener('pointerdown',e=>{
  if(e.button===2){e.preventDefault();activateOverload();return;}
  if(e.button!==0)return;
  if(state==='over')startGame();
  if(e.pointerType!=='mouse'){
    if(activeTouch!==null)return;
    activeTouch=e.pointerId;canvas.setPointerCapture(e.pointerId);e.preventDefault();
  }
  placeHero(e.clientX,e.clientY);
});
function releaseTouch(e){if(e.pointerId===activeTouch)activeTouch=null;}
canvas.addEventListener('pointerup',releaseTouch);
canvas.addEventListener('pointercancel',releaseTouch);
canvas.addEventListener('lostpointercapture',releaseTouch);
canvas.addEventListener('contextmenu',e=>e.preventDefault());

function startGame(){
  if(!sprites||!tierSprites)return;
  bullets=[];enemyBullets=[];enemies=[];particles=[];
  score=0;shotsFired=0;shotTimer=0;enemyTimer=0;gameTime=0;nextBossAt=30;
  overloadUntil=0;overloadReadyAt=0;activeTouch=null;hero.hp=hero.maxHp;hero.hitFlash=0;
  hero.x=(width-hero.w)/2;hero.y=clamp(height*.82-hero.h/2,0,height-hero.h);
  state='playing';scoreElement.textContent='000';
  gameOverPanel.hidden=true;pausePanel.hidden=true;
  pauseButton.disabled=false;pauseButton.textContent='Ⅱ 暂停';
  pauseButton.setAttribute('aria-label','暂停游戏');pauseButton.setAttribute('aria-pressed','false');
  fire();updateHUD();
}
function togglePause(){
  if(state==='playing'){
    state='paused';pausePanel.hidden=false;activeTouch=null;
    pauseButton.textContent='▷ 继续';pauseButton.setAttribute('aria-label','继续游戏');pauseButton.setAttribute('aria-pressed','true');
  }else if(state==='paused'){
    state='playing';pausePanel.hidden=true;previousTime=performance.now();
    pauseButton.textContent='Ⅱ 暂停';pauseButton.setAttribute('aria-label','暂停游戏');pauseButton.setAttribute('aria-pressed','false');
  }
  updateHUD();
}
function endGame(reason='装甲耗尽'){
  if(state!=='playing')return;
  state='over';activeTouch=null;hero.hp=0;
  best=Math.max(best,score);try{localStorage.setItem('deep-space-best',String(best));}catch(_){}
  document.querySelector('#final-score').textContent=score;
  document.querySelector('#best-score').textContent=`最高击落 ${best}`;
  document.querySelector('#death-reason').textContent=reason;
  gameOverPanel.hidden=false;pauseButton.disabled=true;updateHUD();
}
function damageHero(amount=1){
  if(state!=='playing')return;
  hero.hp=Math.max(0,hero.hp-amount);hero.hitFlash=.16;
  if(hero.hp===0){burst(hero.x+hero.w/2,hero.y+hero.h/2,30);endGame('装甲耗尽 · 被敌方弹幕击落');}
}
function activateOverload(){
  if(state!=='playing'||gameTime<overloadReadyAt)return false;
  overloadUntil=gameTime+10;overloadReadyAt=gameTime+60;updateHUD();return true;
}
document.querySelector('#restart').addEventListener('click',startGame);
document.querySelector('#resume').addEventListener('click',togglePause);
pauseButton.addEventListener('click',togglePause);
document.querySelector('#overload').addEventListener('click',activateOverload);
gameOverPanel.addEventListener('pointerdown',e=>{if(e.target===gameOverPanel&&e.button===0)startGame();});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Escape'){e.preventDefault();if(!e.repeat)togglePause();}
  else if(e.code==='KeyE'){e.preventDefault();if(!e.repeat)activateOverload();}
  else if(state==='over'&&(e.code==='KeyR'||e.code==='Enter')){e.preventDefault();startGame();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')togglePause();});
addEventListener('resize',resize);

function fire(){
  const w=5,h=25,lanes=gameTime<overloadUntil?[-.25,0,.25]:[0];
  for(const lane of lanes){
    bullets.push({x:hero.x+hero.w*(.5+lane)-w/2,y:hero.y-h*.65,w,h,vx:0,vy:-1100,dead:false,damage:1,overloaded:lanes.length===3});
    shotsFired++;
  }
}
function selectEnemyType(roll=Math.random()){
  let value=roll*100;
  for(const [type,definition] of Object.entries(ENEMY_TYPES)){
    if(value<definition.weight)return type;value-=definition.weight;
  }
  return 'boss';
}
function spawnEnemy(type){
  const hasBoss=enemies.some(e=>e.type==='boss'&&!e.dead),forced=type!==undefined;
  if(!forced){
    type=selectEnemyType();
    if(!hasBoss&&gameTime>=nextBossAt+45)type='boss';
    if(type==='boss'&&(hasBoss||gameTime<nextBossAt))type=Math.random()<80/98?'normal':'advanced';
  }
  if(!ENEMY_TYPES[type]||(type==='boss'&&hasBoss))return null;
  const size=enemySize(type),config=ENEMY_TYPES[type];
  const enemy={type,...size,x:type==='boss'?(width-size.w)/2:random(0,Math.max(0,width-size.w)),y:-size.h-15,
    hp:config.hp,maxHp:config.hp,speed:config.speed*(type==='boss'?1:random(.86,1.12)),dead:false,deathTime:0,
    hitFlash:0,fireTimer:0,age:0,sweepTimer:0,sweepAngle:0,settled:false,sweeping:false,warning:false,
    targetY:bossTargetY(size.h)};
  enemies.push(enemy);if(type==='boss')nextBossAt=gameTime+60;
  return enemy;
}
function enemyFire(enemy,mode='fan'){
  if(enemy.dead||enemy.type==='normal')return;
  const isSweep=mode==='sweep',speed=enemy.type==='advanced'?150:isSweep?330:220;
  const angles=enemy.type==='advanced'?[-30,30]:isSweep?[enemy.sweepAngle*180/Math.PI]:[-50,-25,0,25,50];
  const muzzles=tierSprites[enemy.type].muzzles;
  for(let i=0;i<angles.length;i++){
    const radians=angles[i]*Math.PI/180,w=isSweep?6:8,h=isSweep?19:14;
    const port=muzzles&&muzzles[isSweep?Math.floor(muzzles.length/2):i];
    const x=enemy.x+enemy.w*(port?port.x:enemy.type==='advanced'?(i===0?.25:.75):.5);
    const y=enemy.y+enemy.h*(port?port.y:.85);
    enemyBullets.push({x:x-w/2,y:y-h/2,w,h,vx:Math.sin(radians)*speed,vy:Math.cos(radians)*speed,
      kind:enemy.type==='advanced'?'advanced':isSweep?'sweep':'boss',dead:false});
  }
}
function killEnemy(enemy){
  if(enemy.dead)return;
  enemy.hp=0;enemy.dead=true;enemy.deathTime=enemy.type==='boss'?.6:.22;
  score++;scoreElement.textContent=String(score).padStart(3,'0');
  burst(enemy.x+enemy.w/2,enemy.y+enemy.h/2,enemy.type==='boss'?55:18);
}
function overlaps(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
// Time of first contact for a moving rectangle; avoids tunnelling by fast diagonal shots.
function sweptHitTime(b,previousX,previousY,target){
  let entry=0,exit=1;
  for(const [start,delta,min,max] of [[previousX,b.x-previousX,target.x-b.w,target.x+target.w],[previousY,b.y-previousY,target.y-b.h,target.y+target.h]]){
    if(Math.abs(delta)<1e-9){if(start<min||start>max)return null;continue;}
    const t1=(min-start)/delta,t2=(max-start)/delta;
    entry=Math.max(entry,Math.min(t1,t2));exit=Math.min(exit,Math.max(t1,t2));
    if(entry>exit)return null;
  }
  return entry;
}
function burst(x,y,amount=14){
  for(let i=0;i<amount;i++){
    const angle=random(0,Math.PI*2),speed=random(35,190);
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:random(.2,.55),maxLife:.55,r:random(1,3)});
  }
  if(particles.length>220)particles.splice(0,particles.length-220);
}
function updateEnemy(enemy,dt){
  enemy.hitFlash=Math.max(0,enemy.hitFlash-dt);
  if(enemy.dead){enemy.deathTime-=dt;return;}
  if(enemy.type==='boss'){
    enemy.y=Math.min(enemy.targetY,enemy.y+enemy.speed*dt);
    if(enemy.y<enemy.targetY)return;
    enemy.settled=true;enemy.age+=dt;
    const phase=enemy.age%9;enemy.sweeping=phase>=6.8;enemy.warning=phase>=6.2&&!enemy.sweeping;
    if(enemy.sweeping){
      enemy.fireTimer=0;enemy.sweepTimer+=dt;
      enemy.sweepAngle=(-70+(phase-6.8)/2.2*140)*Math.PI/180;
      while(enemy.sweepTimer>=.09){enemy.sweepTimer-=.09;enemyFire(enemy,'sweep');}
    }else{
      enemy.sweepTimer=0;
      if(enemy.warning){enemy.fireTimer=0;return;}
      enemy.fireTimer+=dt;while(enemy.fireTimer>=.75){enemy.fireTimer-=.75;enemyFire(enemy);}
    }
  }else{
    enemy.y+=enemy.speed*dt;enemy.age+=dt;
    if(enemy.type==='advanced'){
      enemy.fireTimer+=dt;
      while(enemy.fireTimer>=2.2){enemy.fireTimer-=2.2;if(enemy.y+enemy.h>0&&enemy.y<height)enemyFire(enemy);}
    }
  }
}
function updateGame(dt){
  if(state!=='playing')return;
  gameTime+=dt;shotTimer+=dt;enemyTimer+=dt;hero.hitFlash=Math.max(0,hero.hitFlash-dt);
  while(shotTimer>=SHOT_INTERVAL){shotTimer-=SHOT_INTERVAL;fire();}
  const bossAlive=enemies.some(e=>e.type==='boss'&&!e.dead);
  const spawnInterval=bossAlive?1.65:Math.max(.65,1.05-gameTime*.0015)/Math.min(1.6,Math.max(1,width/900));
  while(enemyTimer>=spawnInterval){enemyTimer-=spawnInterval;spawnEnemy();}
  for(const enemy of enemies)updateEnemy(enemy,dt);
  const hitbox={x:hero.x+hero.w*.22,y:hero.y+hero.h*.18,w:hero.w*.56,h:hero.h*.65};
  // Physical contact is always fatal, including at full armor and immediately after launch.
  for(const enemy of enemies){
    if(!enemy.dead&&overlaps(hitbox,enemy)){
      burst(hero.x+hero.w/2,hero.y+hero.h/2,30);endGame('机体碰撞 · 战机损毁');return;
    }
  }
  for(const bullet of bullets){
    if(bullet.dead)continue;
    const px=bullet.x,py=bullet.y;bullet.x+=(bullet.vx||0)*dt;bullet.y+=bullet.vy*dt;
    let hit=null,firstTime=Infinity;
    for(const enemy of enemies){
      if(enemy.dead)continue;
      const time=sweptHitTime(bullet,px,py,enemy);
      if(time!==null&&time<firstTime){hit=enemy;firstTime=time;}
    }
    if(hit){bullet.dead=true;hit.hp=Math.max(0,hit.hp-1);hit.hitFlash=.09;if(hit.hp===0)killEnemy(hit);}
  }
  for(const bullet of enemyBullets){
    if(bullet.dead)continue;
    const px=bullet.x,py=bullet.y;bullet.x+=bullet.vx*dt;bullet.y+=bullet.vy*dt;
    if(sweptHitTime(bullet,px,py,hitbox)!==null){bullet.dead=true;damageHero(1);if(state==='over')break;}
  }
  const onScreen=b=>!b.dead&&b.y+b.h>-40&&b.y<height+40&&b.x+b.w>-40&&b.x<width+40;
  bullets=bullets.filter(onScreen);enemyBullets=enemyBullets.filter(onScreen);
  enemies=enemies.filter(e=>e.dead?e.deathTime>0:e.y<height+e.h);
}
function updateParticles(dt){
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=Math.exp(-dt*2);p.vy*=Math.exp(-dt*2);}
  particles=particles.filter(p=>p.life>0);
}
function updateHUD(){
  document.querySelector('#health-value').textContent=`${hero.hp} / ${hero.maxHp}`;
  const health=document.querySelector('#health-fill');health.style.width=`${hero.hp/hero.maxHp*100}%`;
  health.style.background=hero.hp<=5?'#ff657e':hero.hp<=10?'#ffc075':'#75e9e5';
  document.querySelector('#health-meter').setAttribute('aria-valuenow',hero.hp);
  const ability=document.querySelector('#overload'),active=state!=='over'&&gameTime<overloadUntil;
  const remaining=Math.max(0,overloadReadyAt-gameTime),value=document.querySelector('#overload-state');
  ability.disabled=state!=='playing'||(!active&&remaining>0);
  ability.classList.toggle('active',active);ability.classList.toggle('cooldown',!active&&remaining>0);
  ability.setAttribute('aria-pressed',String(active));
  value.textContent=active?`超载中 ${(overloadUntil-gameTime).toFixed(1)}s`:remaining>0?`冷却 ${Math.ceil(remaining)}s`:'超载就绪';
  document.querySelector('#weapon-status').textContent=active?'三束连射 · 37.5 发/秒':'自动连射 · 12.5 发/秒';
  const boss=enemies.find(e=>e.type==='boss'&&!e.dead),bar=document.querySelector('#boss-status');
  bar.hidden=!boss;
  if(boss){
    document.querySelector('#boss-health').textContent=`${boss.hp} / ${boss.maxHp}`;
    document.querySelector('#boss-fill').style.width=`${boss.hp/boss.maxHp*100}%`;
    const mode=document.querySelector('#boss-mode');
    mode.textContent=boss.warning?'⚠ 扫射蓄能':boss.sweeping?'⚠ 高速扫射':boss.settled?'五向火力':'敌舰接近中';
    bar.classList.toggle('danger',boss.sweeping||boss.warning);
  }
}
function drawEnemy(enemy){
  const art=tierSprites[enemy.type];ctx.save();
  if(enemy.dead){ctx.globalAlpha=clamp(enemy.deathTime/(enemy.type==='boss'?.6:.22),0,1);ctx.drawImage(art.death,enemy.x,enemy.y,enemy.w,enemy.h);}
  else{
    ctx.shadowBlur=enemy.type==='boss'?19:10;ctx.shadowColor=enemy.type==='normal'?'#ed3bbd70':enemy.type==='advanced'?'#aa73ff90':'#ff715080';
    ctx.drawImage(art.sprite,enemy.x,enemy.y,enemy.w,enemy.h);
    if(enemy.hitFlash>0){ctx.globalCompositeOperation='screen';ctx.globalAlpha=enemy.hitFlash/.09*.6;ctx.drawImage(art.sprite,enemy.x,enemy.y,enemy.w,enemy.h);}
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.shadowBlur=0;
    if(enemy.type!=='boss'){
      const y=enemy.y-10,barW=enemy.w*.72,x=enemy.x+(enemy.w-barW)/2;
      ctx.fillStyle='#091222d9';ctx.fillRect(x,y,barW,3);
      ctx.fillStyle=enemy.type==='advanced'?'#c4a1ff':'#ff83b3';ctx.fillRect(x,y,barW*enemy.hp/enemy.maxHp,3);
      if(enemy.type==='advanced'){ctx.fillStyle='#be9df5';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillText('ELITE',enemy.x+enemy.w/2,y-5);}
    }
    if(enemy.type==='boss'&&(enemy.warning||enemy.sweeping)){
      const cx=enemy.x+enemy.w/2,y=enemy.y+enemy.h*.85;
      ctx.globalAlpha=enemy.warning?.32:.12;ctx.fillStyle='#ff6f5c';
      ctx.beginPath();ctx.arc(cx,y,enemy.w*.16,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
      if(enemy.warning){ctx.strokeStyle='#ffb36baa';ctx.lineWidth=1;ctx.setLineDash([5,8]);ctx.beginPath();ctx.moveTo(cx,y);ctx.lineTo(cx,height);ctx.stroke();ctx.setLineDash([]);}
    }
  }
  ctx.restore();
}
function drawGame(){
  for(const enemy of enemies)drawEnemy(enemy);
  ctx.save();ctx.shadowColor='#63e8ff';ctx.shadowBlur=12;
  for(const b of bullets){
    ctx.globalAlpha=.2;ctx.fillStyle=b.overloaded?'#c796ff':'#54caff';ctx.fillRect(b.x-2,b.y+8,b.w+4,b.h+14);
    ctx.globalAlpha=1;ctx.fillStyle=b.overloaded?'#f4deff':'#c9faff';ctx.fillRect(b.x,b.y,b.w,b.h);
  }
  ctx.restore();
  ctx.save();
  for(const b of enemyBullets){
    ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);ctx.rotate(-Math.atan2(b.vx,b.vy));
    const color=b.kind==='advanced'?'#dca1ff':b.kind==='sweep'?'#ff8c6c':'#ffc06a';
    ctx.shadowColor=color;ctx.shadowBlur=10;ctx.fillStyle=color;
    ctx.beginPath();ctx.ellipse(0,0,b.w*.58,b.h*.55,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff1da';ctx.fillRect(-1.1,-b.h*.3,2.2,b.h*.6);ctx.restore();
  }
  ctx.restore();
  if(state!=='over'){
    const cx=hero.x+hero.w/2,overloaded=gameTime<overloadUntil;
    ctx.save();
    for(const engineX of [.30,.70]){
      const x=hero.x+hero.w*engineX,y=hero.y+hero.h*.84;
      const length=hero.h*((overloaded?.46:.35)+Math.sin(spaceTime*38+engineX)*.025);
      const flame=ctx.createLinearGradient(x,y,x,y+length);
      flame.addColorStop(0,'#e5ffff');flame.addColorStop(.25,overloaded?'#e0acffdc':'#6af1ffdc');
      flame.addColorStop(.62,overloaded?'#a94dff90':'#358cff70');flame.addColorStop(1,'#306cff00');
      ctx.fillStyle=flame;ctx.shadowBlur=9;ctx.shadowColor=overloaded?'#b777ff':'#21c9ff';
      ctx.beginPath();ctx.moveTo(x-hero.w*.052,y);ctx.lineTo(x+hero.w*.052,y);
      ctx.lineTo(x+hero.w*.027,y+length*.62);ctx.lineTo(x,y+length);ctx.lineTo(x-hero.w*.027,y+length*.62);ctx.closePath();ctx.fill();
    }
    ctx.shadowColor=hero.hitFlash>0?'#ff6e90':overloaded?'#c38aff':'#35e9ff70';ctx.shadowBlur=overloaded?19:9;
    ctx.drawImage(sprites.hero,hero.x,hero.y,hero.w,hero.h);
    if(hero.hitFlash>0){ctx.globalCompositeOperation='screen';ctx.globalAlpha=.65;ctx.drawImage(sprites.hero,hero.x,hero.y,hero.w,hero.h);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
    if(overloaded){
      ctx.strokeStyle='#cf9cffa0';ctx.lineWidth=1.2;ctx.setLineDash([8,12]);
      ctx.beginPath();ctx.ellipse(cx,hero.y+hero.h*.55,hero.w*.65,hero.h*.65,spaceTime*.15,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    }
    ctx.restore();
  }
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of particles){ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);ctx.fillStyle=p.life>.25?'#ffe4ad':'#ff814b';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}
function frame(timestamp){
  const dt=previousTime?Math.min(Math.max(0,(timestamp-previousTime)/1000),.04):0;
  previousTime=timestamp;frameCount++;
  if(state!=='paused'){
    if(!reducedMotion)spaceTime+=dt;
    if(state==='playing')updateGame(dt);
    updateParticles(dt);
  }
  background.draw(ctx,spaceTime,state==='paused'||reducedMotion?0:dt);
  if(sprites&&tierSprites)drawGame();updateHUD();requestAnimationFrame(frame);
}
function initialize(){
  try{
    sprites=createCyberFighters();tierSprites=createEnemyTiers(sprites);
    resize();background=new SpaceBackground(width,height);
    document.querySelector('#loading').hidden=true;
    startGame();requestAnimationFrame(frame);
  }catch(error){document.querySelector('#load-message').textContent=error.message;console.error(error);}
}
// TEST_OBSERVATION_POINT
initialize();

</script>
